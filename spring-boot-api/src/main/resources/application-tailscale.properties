# Perfil de despliegue por Tailscale. Se activa con --spring.profiles.active=tailscale
# TAILSCALE_IP y TAILSCALE_URL_PUBLICA los define despliegue/iniciar-servidor.ps1

# La API solo escucha en la interfaz de Tailscale, no en la red Wi-Fi
server.address=${TAILSCALE_IP}

# Solo se acepta al frontend servido por la VPN o por la dirección de Tailscale Funnel
app.cors.origenes=http://${TAILSCALE_IP}:4200,${TAILSCALE_URL_PUBLICA}

# Al estar publicado, el código solo llega por correo. Si el envío falla, el registro se cancela con un error.
app.verificacion.mostrar-codigo-en-consola=false

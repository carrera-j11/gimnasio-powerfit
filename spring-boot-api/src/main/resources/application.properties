spring.application.name=gimnasio-api
# Railway asigna el puerto en la variable PORT; en local se usa 8080
server.port=${PORT:8080}

# Valores sensibles para desarrollo local (archivo excluido de Git, ver secretos-local.properties.example).
# En Railway no existe y todo se toma de las variables de entorno.
spring.config.import=optional:classpath:secretos-local.properties

# ===== Conexión a la base de datos MySQL =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gimnasio_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Guayaquil&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Las validaciones se hacen en el controlador (@Valid), no otra vez al guardar
spring.jpa.properties.jakarta.persistence.validation.mode=none

# ===== JWT =====
# Clave secreta (Base64, mínimo 256 bits). Nunca se sube al repositorio.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-ms=${JWT_EXPIRACION_MS:3600000}

# ===== Correo =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ===== Verificación de cuentas =====
app.verificacion.minutos-expiracion=15
app.verificacion.max-intentos=5
# Si es true, el código también se imprime en el log (útil si el proveedor bloquea SMTP)
app.verificacion.mostrar-codigo-en-consola=${MOSTRAR_CODIGO_EN_CONSOLA:true}

# ===== Administrador inicial (se crea al arrancar si no existe) =====
app.admin.cedula=${ADMIN_CEDULA:0100339076}
app.admin.nombres=${ADMIN_NOMBRES:Administrador}
app.admin.apellidos=${ADMIN_APELLIDOS:General}
app.admin.email=${ADMIN_EMAIL:javier@admin.com}
app.admin.celular=${ADMIN_CELULAR:0999999999}
app.admin.password=${ADMIN_PASSWORD}

# ===== CORS: frontends que pueden consumir la API (separados por coma) =====
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200,http://localhost:4201,http://localhost:5173}
